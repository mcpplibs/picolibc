# ── The machine half ────────────────────────────────────────────
#
# ⚠️ ONE BLOCK PER ARCH SPELLING, BECAUSE `cfg(arch = ...)` COMPARES EXACTLY.
# There is no glob, and mcpp spells each M-profile row's arch differently
# because objects built for them are not interchangeable. The CONTENT of every
# block is the same — that is the point: one machine directory serves the whole
# family, and only the selection is per row.
[target.'cfg(arch = "thumbv6m")'.build]
sources = [
           # The four architectures this target is NOT. They must be excluded
           # HERE rather than in the base set: a negative glob in the base is
           # applied to the merged set and would cancel the additions below.
           "!picolibc/libc/machine/aarch64/**", "!picolibc/libm/machine/aarch64/**",
           "!picolibc/libc/machine/riscv/**",   "!picolibc/libm/machine/riscv/**",
           "!picolibc/libc/machine/x86/**",     "!picolibc/libm/machine/x86/**",
           "!picolibc/libc/machine/x86_64/**",
           # ⚠️⚠️ AND THE ARM FILES ARE LISTED, NOT GLOBBED. The machine directory carries variants for
           # every ARM profile upstream serves — `memcpy-armv7a.S` needs ARM mode
           # and Thumb-2, neither of which an M-profile core has — and meson picks
           # among them by CPU feature. A glob assembles all of them and dies on
           #
           #     instruction requires: arm-mode
           #             ldr r10, [sp], #32
           #
           # These are the 18 + 18 files upstream compiles for a soft-float
           # M-profile target, read out of a real build.
           "picolibc/libc/machine/arm/aeabi_memset.c",
           "picolibc/libc/machine/arm/bzero.c",
           "picolibc/libc/machine/arm/interrupt.c",
           "picolibc/libc/machine/arm/memchr.S",
           "picolibc/libc/machine/arm/memchr.c",
           "picolibc/libc/machine/arm/memcpy.S",
           "picolibc/libc/machine/arm/memcpy.c",
           "picolibc/libc/machine/arm/memmove.c",
           "picolibc/libc/machine/arm/memset.S",
           "picolibc/libc/machine/arm/memset.c",
           "picolibc/libc/machine/arm/read_tp.S",
           "picolibc/libc/machine/arm/set_tls.c",
           "picolibc/libc/machine/arm/setjmp.S",
           "picolibc/libc/machine/arm/strcmp.S",
           "picolibc/libc/machine/arm/strcpy.S",
           "picolibc/libc/machine/arm/strlen.S",
           "picolibc/libc/machine/arm/strlen.c",
           "picolibc/libc/machine/arm/tls.c",
           "picolibc/libm/machine/arm/s_ceil.c",
           "picolibc/libm/machine/arm/s_fabs.c",
           "picolibc/libm/machine/arm/s_floor.c",
           "picolibc/libm/machine/arm/s_fma_arm.c",
           "picolibc/libm/machine/arm/s_nearbyint.c",
           "picolibc/libm/machine/arm/s_rint.c",
           "picolibc/libm/machine/arm/s_round.c",
           "picolibc/libm/machine/arm/s_sqrt.c",
           "picolibc/libm/machine/arm/s_trunc.c",
           "picolibc/libm/machine/arm/sf_ceil.c",
           "picolibc/libm/machine/arm/sf_fabs.c",
           "picolibc/libm/machine/arm/sf_floor.c",
           "picolibc/libm/machine/arm/sf_fma_arm.c",
           "picolibc/libm/machine/arm/sf_nearbyint.c",
           "picolibc/libm/machine/arm/sf_rint.c",
           "picolibc/libm/machine/arm/sf_round.c",
           "picolibc/libm/machine/arm/sf_sqrt.c",
           "picolibc/libm/machine/arm/sf_trunc.c",
           "picolibc/libos/semihost/machine/arm/*.S"]
include_dirs = ["picolibc/libc/machine/arm"]

